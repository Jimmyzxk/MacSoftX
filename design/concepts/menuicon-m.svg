<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- macOS Menu Bar Template Icon: M-Negative-Space Variant (双竖片 + 菱形 M 负空间剪影) -->
  <!-- Pure black silhouette (#000000) on transparent background for system auto-tinting -->

  <!-- Left Pillar (rx=2.25) -->
  <rect x="4.5" y="6" width="4.5" height="20" rx="2.25" fill="#000000" />

  <!-- Right Pillar (rx=2.25) -->
  <rect x="23" y="6" width="4.5" height="20" rx="2.25" fill="#000000" />

  <!-- Center Diamond (Rotated 45 degrees, forming M valley negative space) -->
  <g transform="translate(16, 13.5) rotate(45)">
    <rect x="-2.8" y="-2.8" width="5.6" height="5.6" rx="1" fill="#000000" />
  </g>
</svg>
