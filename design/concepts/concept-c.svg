<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS App Icon Drop Shadows -->
    <filter id="icon-shadow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="32" stdDeviation="36" flood-color="#00040e" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#04091a" flood-opacity="0.25" />
    </filter>

    <!-- Block 3D Elevation Drop Shadows -->
    <filter id="block-shadow-base" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#010614" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020a1f" flood-opacity="0.35" />
    </filter>

    <filter id="block-shadow-floating" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#010512" flood-opacity="0.7" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#031b40" flood-opacity="0.4" />
    </filter>

    <filter id="glow-m" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Base Squircle Slate/Navy Gradient -->
    <linearGradient id="bg-grad-c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#11192e" />
      <stop offset="45%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#04070f" />
    </linearGradient>

    <!-- Squircle Center Ambient Aurora -->
    <radialGradient id="aurora-c" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#00c7be" stop-opacity="0.22" />
      <stop offset="40%" stop-color="#0a84ff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle Bevel Highlight -->
    <linearGradient id="squircle-rim-c" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.16" />
    </linearGradient>

    <!-- Block 1: macOS System Blue Gradient -->
    <linearGradient id="cube-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="20%" stop-color="#0a84ff" />
      <stop offset="70%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#003bb8" />
    </linearGradient>

    <!-- Block 2: Mint Cyan Gradient -->
    <linearGradient id="cube-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="25%" stop-color="#34d399" />
      <stop offset="65%" stop-color="#00c7be" />
      <stop offset="100%" stop-color="#008080" />
    </linearGradient>

    <!-- Block 3: Frosted Glass White Gradient -->
    <linearGradient id="cube-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#f8fafc" stop-opacity="0.88" />
      <stop offset="80%" stop-color="#e2e8f0" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.75" />
    </linearGradient>

    <!-- Glass Rim Bevel for Blocks -->
    <linearGradient id="block-bevel-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="glass-specular-white" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Diagonal Glass Sheen -->
    <linearGradient id="glass-sweep-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <!-- Base macOS Squircle with Ambient Shadows -->
  <g filter="url(#icon-shadow-c)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg-grad-c)" />
    <!-- Center Aurora -->
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#aurora-c)" />
    <!-- Diagonal Glass Sheen -->
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#glass-sweep-c)" />
    <!-- 1.5px Squircle Rim Bevel -->
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" ry="183.5" fill="none" stroke="url(#squircle-rim-c)" stroke-width="3" />
  </g>

  <!-- Ambient Micro-Grid lines (macOS Precision Utility feel) -->
  <g opacity="0.15">
    <line x1="236" y1="512" x2="788" y2="512" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" />
    <line x1="512" y1="260" x2="512" y2="760" stroke="#00c7be" stroke-width="1.5" stroke-dasharray="6 8" />
    <circle cx="512" cy="512" r="280" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 12" />
  </g>

  <!-- Backlight Under the M Negative Space (Soft Cyan/White Aura highlighting the M) -->
  <g filter="url(#glow-m)" opacity="0.45">
    <path d="M 326 710 L 326 390 L 512 550 L 698 390 L 698 710"
          fill="none" stroke="#60a5fa" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- THREE SOFTWARE CUBES (三颗圆角方块叠成 M 负空间) -->

  <!-- BLOCK 1: Left Module (macOS System Blue Software Slab) -->
  <g filter="url(#block-shadow-base)">
    <!-- Base Blue Rounded Block -->
    <rect x="236" y="360" width="180" height="350" rx="42" fill="url(#cube-blue)" />
    <!-- Top Glass Rim Bevel -->
    <rect x="237" y="361" width="178" height="348" rx="41" fill="none" stroke="url(#block-bevel-light)" stroke-width="2.5" />
    <!-- Inner Gloss Top Arc -->
    <path d="M 244 402 C 244 380, 260 364, 282 364 L 370 364 C 392 364, 408 380, 408 402"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <!-- Software Module Glyphs / Status Bars (Subtle) -->
    <rect x="272" y="630" width="108" height="8" rx="4" fill="#ffffff" opacity="0.25" />
    <rect x="272" y="652" width="70" height="8" rx="4" fill="#ffffff" opacity="0.15" />
  </g>

  <!-- BLOCK 2: Right Module (Mint Cyan Software Slab) -->
  <g filter="url(#block-shadow-base)">
    <!-- Base Mint Cyan Rounded Block -->
    <rect x="608" y="360" width="180" height="350" rx="42" fill="url(#cube-cyan)" />
    <!-- Top Glass Rim Bevel -->
    <rect x="609" y="361" width="178" height="348" rx="41" fill="none" stroke="url(#block-bevel-light)" stroke-width="2.5" />
    <!-- Inner Gloss Top Arc -->
    <path d="M 616 402 C 616 380, 632 364, 654 364 L 742 364 C 764 364, 780 380, 780 402"
          fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <!-- Software Module Glyphs / Status Bars (Subtle) -->
    <rect x="644" y="630" width="108" height="8" rx="4" fill="#ffffff" opacity="0.25" />
    <rect x="644" y="652" width="56" height="8" rx="4" fill="#ffffff" opacity="0.15" />
  </g>

  <!-- BLOCK 3: Center-Top Floating Module (Frosted Glass Ice White Diamond/Wedge) -->
  <!-- This floating rounded block dips between Block 1 and Block 2, precisely carving out the M negative space -->
  <g filter="url(#block-shadow-floating)">
    <!-- Rotated 45-degree Rounded Cube -->
    <g transform="translate(512, 386) rotate(45)">
      <!-- Main Frosted Glass Body -->
      <rect x="-105" y="-105" width="210" height="210" rx="44" fill="url(#cube-white)" />
      <!-- Specular Bevel Border -->
      <rect x="-104" y="-104" width="208" height="208" rx="43" fill="none" stroke="url(#glass-specular-white)" stroke-width="3" />
      <!-- Inner Diagonal Refraction -->
      <line x1="-80" y1="-80" x2="80" y2="80" stroke="#ffffff" stroke-width="2" opacity="0.5" />
      <!-- Glass Corner Specular -->
      <circle cx="-55" cy="-55" r="8" fill="#ffffff" opacity="0.6" />
    </g>
  </g>

  <!-- Specular Reflection across the whole Negative Space 'M' -->
  <path d="M 326 700 L 326 406 L 512 558 L 698 406 L 698 700"
        fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" />

  <!-- Bottom Balance Indicator -->
  <rect x="470" y="836" width="84" height="6" rx="3" fill="#00c7be" opacity="0.4" />
</svg>
